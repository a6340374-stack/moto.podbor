<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ДМИТРИЙ · МОТОПОДБОР</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<meta name="theme-color" content="#16223f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101010; --panel:#181816; --ink:#f3f1ea; --mut:#9a978c; --yel:#ffd400; --red:#ff3b2f;
  --line:#2a2a26; --hard:6px 6px 0 #000;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Archivo',system-ui,sans-serif;background:#000;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;overflow:hidden;padding-bottom:84px}
.anton{font-family:'Anton',sans-serif;text-transform:uppercase;font-weight:400;letter-spacing:.01em}
.mono{font-family:'Space Mono',monospace}
section{padding:40px 18px}
.hazard{height:14px;background:repeating-linear-gradient(45deg,var(--yel),var(--yel) 16px,#000 16px,#000 32px)}
.tag{display:inline-block;font-family:'Space Mono';font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#000;background:var(--yel);padding:4px 9px}
.tag.line{background:transparent;color:var(--yel);border:1.5px solid var(--yel)}

/* top */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;background:#0c0c0c;border-bottom:2px solid var(--yel)}
.top .logo{font-family:'Anton';text-transform:uppercase;font-size:19px;letter-spacing:.02em}
.top .logo b{color:var(--yel)}
.top .city{font-family:'Space Mono';font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px;text-transform:uppercase}
.dot{width:8px;height:8px;background:var(--yel)}

/* hero */
.hero{position:relative}
.hero .imgwrap{position:relative;border-bottom:3px solid var(--yel)}
.hero .imgwrap img{width:100%;height:330px;object-fit:cover;object-position:50% 32%;display:block;filter:contrast(1.05) saturate(.92)}
.hero .imgwrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,16,16,.45),transparent 40%,rgba(16,16,16,.5) 100%)}
.hero .stamp{position:absolute;top:16px;right:14px;z-index:2;background:var(--red);color:#fff;font-family:'Space Mono';font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;padding:7px 11px;transform:rotate(4deg);border:2px solid #000;box-shadow:3px 3px 0 #000}
.hero .htext{padding:22px 18px 4px}
.hero h1{font-family:'Anton';font-size:60px;line-height:.86;text-transform:uppercase}
.hero h1 .out{color:var(--bg);-webkit-text-stroke:2px var(--yel)}
.hero h1 .yel{color:var(--yel)}
.hero p.sub{font-size:15.5px;color:#d4d1c8;margin-top:16px;max-width:340px;font-weight:500}
.hero .rate{display:flex;align-items:center;gap:10px;margin-top:16px;font-family:'Space Mono';font-size:13px}
.hero .rate .st{color:var(--yel);letter-spacing:2px;font-size:15px}
.hero .rate a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--yel)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;font-family:'Archivo';font-weight:800;
  text-transform:uppercase;letter-spacing:.04em;font-size:15px;text-decoration:none;border:2px solid #000;cursor:pointer}
.btn svg{width:18px;height:18px}
.btn-y{background:var(--yel);color:#000;box-shadow:var(--hard)}
.btn-o{background:var(--panel);color:var(--ink);border-color:var(--yel);box-shadow:4px 4px 0 #000}
.cta-row{display:flex;gap:12px;padding:18px 18px 4px}
.cta-row .btn{flex:1}

/* marquee strip */
.strip{background:var(--yel);color:#000;overflow:hidden;border-top:3px solid #000;border-bottom:3px solid #000;padding:9px 0}
.strip .run{display:flex;gap:26px;white-space:nowrap;font-family:'Anton';text-transform:uppercase;font-size:15px;animation:run 18s linear infinite}
.strip .run span{display:flex;align-items:center;gap:26px}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.stats .c{padding:22px 18px;border-bottom:2px solid var(--line);border-right:2px solid var(--line)}
.stats .c:nth-child(2n){border-right:0}
.stats .v{font-family:'Anton';font-size:38px;line-height:.9;color:var(--yel)}
.stats .l{font-family:'Space Mono';font-size:11px;text-transform:uppercase;color:var(--mut);margin-top:6px;letter-spacing:.04em}

.sec-head h2{font-family:'Anton';font-size:40px;line-height:.9;margin-top:10px}
.sec-head h2 .yel{color:var(--yel)}
.sec-head .lead{color:var(--mut);font-size:14.5px;margin-top:12px;max-width:340px;font-weight:500}
.sec-head{margin-bottom:24px}

/* checks */
.checks{display:flex;flex-direction:column;gap:0;border:2px solid var(--line)}
.check{display:flex;gap:14px;padding:18px;border-bottom:2px solid var(--line);background:var(--panel)}
.check:last-child{border-bottom:0}
.check .no{font-family:'Anton';font-size:22px;color:var(--yel);flex:0 0 38px;line-height:1}
.check h3{font-family:'Archivo';font-weight:800;text-transform:uppercase;font-size:16px;letter-spacing:.01em}
.check p{font-size:13.5px;color:var(--mut);margin-top:4px}

/* steps */
.steps{display:flex;flex-direction:column;gap:14px}
.pstep{border:2px solid var(--yel);background:var(--panel);padding:18px;box-shadow:4px 4px 0 #000;position:relative}
.pstep .n{font-family:'Anton';font-size:30px;color:var(--yel);position:absolute;top:12px;right:16px;opacity:.9}
.pstep h3{font-family:'Archivo';font-weight:800;text-transform:uppercase;font-size:17px;max-width:78%}
.pstep p{font-size:13.5px;color:var(--mut);margin-top:6px}

/* specs tags */
.spectags{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.spectags span{font-family:'Space Mono';font-weight:700;font-size:12px;text-transform:uppercase;padding:8px 12px;border:2px solid var(--line);color:#d4d1c8}

/* pricing */
.pcard{border:2px solid var(--line);background:var(--panel);padding:20px;margin-bottom:12px;position:relative}
.pcard.hit{border-color:var(--yel);box-shadow:var(--hard)}
.pcard .badge{position:absolute;top:-13px;left:16px;background:var(--red);color:#fff;font-family:'Space Mono';font-weight:700;font-size:11px;padding:4px 10px;text-transform:uppercase;border:2px solid #000;transform:rotate(-2deg)}
.pcard h3{font-family:'Space Mono';font-weight:700;text-transform:uppercase;font-size:13px;color:var(--mut);letter-spacing:.04em}
.pcard .p{font-family:'Anton';font-size:38px;margin:8px 0 8px;line-height:.9}
.pcard.hit .p{color:var(--yel)}
.pcard p.d{font-size:13px;color:var(--mut)}

/* gallery */
.gal{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;border-top:3px solid var(--yel);border-bottom:3px solid var(--yel);scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gcard{flex:0 0 80%;scroll-snap-align:start;position:relative;border-right:3px solid #000}
.gcard img{width:100%;height:260px;object-fit:cover;display:block}
.gcard .cap{position:absolute;left:0;bottom:0;right:0;font-family:'Space Mono';font-size:11px;text-transform:uppercase;
  background:var(--yel);color:#000;padding:7px 12px;font-weight:700;letter-spacing:.02em}

/* reviews */
.revscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 10px;margin:0 -18px;scrollbar-width:none}
.revscroll::-webkit-scrollbar{display:none}
.revcard{flex:0 0 260px;scroll-snap-align:center;background:#fff;border:3px solid #000;box-shadow:5px 5px 0 var(--yel);cursor:zoom-in;overflow:hidden}
.revcard img{width:100%;display:block;max-height:420px;object-fit:cover;object-position:top}
.hint{font-family:'Space Mono';font-size:11px;color:var(--mut);text-align:center;margin-top:14px;text-transform:uppercase}

/* faq */
.faq{border:2px solid var(--line)}
.qa{border-bottom:2px solid var(--line);background:var(--panel)}
.qa:last-child{border-bottom:0}
.qa summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;
  font-family:'Archivo';font-weight:700;text-transform:uppercase;font-size:14px}
.qa summary::-webkit-details-marker{display:none}
.qa .pm{font-family:'Anton';color:var(--yel);font-size:22px;line-height:1}
.qa[open] .pm{color:var(--red)}
.qa .a{padding:0 18px 16px;font-size:13.5px;color:var(--mut)}

/* final */
.final{background:var(--yel);color:#000;border:3px solid #000;box-shadow:var(--hard);padding:30px 20px;text-align:center;margin:0 2px}
.final h2{font-family:'Anton';font-size:42px;line-height:.9;color:#000}
.final p{font-size:14.5px;font-weight:600;margin:14px auto 22px;max-width:300px;color:#1a1a17}
.final .btn-y{background:#000;color:var(--yel);box-shadow:4px 4px 0 rgba(0,0,0,.25);border-color:#000}
.final .btn-o{background:transparent;color:#000;border-color:#000;box-shadow:none}

footer{padding:28px 18px;border-top:2px solid var(--line);font-family:'Space Mono';font-size:11px;color:var(--mut);line-height:1.8;text-transform:uppercase}
footer b{color:var(--yel);font-family:'Anton';font-size:18px;letter-spacing:.02em}

.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:440px;margin:0 auto;display:flex;gap:10px;
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));background:#0c0c0c;border-top:3px solid var(--yel)}
.bottombar .btn{flex:1;height:50px;font-size:14px;box-shadow:none}

.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;padding:24px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:88vh;border:3px solid var(--yel)}
.lb .x{position:absolute;top:18px;right:18px;width:44px;height:44px;border:2px solid var(--yel);background:#000;color:var(--yel);font-size:22px;cursor:pointer}

.modal{position:fixed;inset:0;z-index:120;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65)}
.modal.on{display:flex}
.sheet{width:100%;max-width:440px;background:var(--panel);border-top:3px solid var(--yel);padding:24px 18px calc(24px + env(safe-area-inset-bottom));animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{font-family:'Anton';font-size:30px;text-transform:uppercase}
.sheet p.s{color:var(--mut);font-size:13.5px;margin:6px 0 16px}
.field{margin-bottom:11px}
.field label{display:block;font-family:'Space Mono';font-weight:700;font-size:11px;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.field input,.field textarea{width:100%;background:var(--bg);border:2px solid var(--line);padding:12px 13px;color:var(--ink);font-family:'Archivo';font-size:15px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--yel)}
.thanks{text-align:center;padding:14px 0}
.thanks .ok{width:64px;height:64px;background:var(--yel);color:#000;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;border:2px solid #000}
.thanks .ok svg{width:32px;height:32px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="lb" id="lb"><button class="x" onclick="closeLB()">×</button><img id="lbimg" src="" alt=""></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="content.js"></script>
<script>
const M=window.MP;
const ck='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>';
const ic={
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 5h16v11H8l-4 4V5z"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 4h4l2 5-3 2a14 14 0 006 6l2-3 5 2v4a2 2 0 01-2 2A17 17 0 013 6a2 2 0 012-2z"/></svg>'
};
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const marquee='ОСМОТР ★ ДИАГНОСТИКА ★ ЭНДОСКОПИЯ ★ ЮРИДИКА ★ ТОРГ ★ ДОСТАВКА ★ ';

document.getElementById('app').innerHTML=`
<div class="top">
  <div class="logo">${M.expert} · <b>МОТОПОДБОР</b></div>
  <div class="city"><span class="dot"></span>${M.city}</div>
</div>

<header class="hero">
  <div class="imgwrap">
    <div class="stamp">★ 126 ОТЗЫВОВ · 5,0</div>
    <img src="assets/hero.jpg" alt="${M.expert}">
  </div>
  <div class="htext">
    <span class="tag">Эксперт · ${M.city} +200 км</span>
    <h1 style="margin-top:14px">Не бери<br><span class="yel">мото</span> вслепую</h1>
    <p class="sub">Выеду, проверю до винтика и скажу честно: брать или валить. Техника, юридика, торг — всё по делу.</p>
    <div class="rate"><span class="st">★★★★★</span> 5,0 <a href="#reviews">// 126 отзывов</a></div>
  </div>
  <div class="cta-row">
    <a class="btn btn-y" href="javascript:openForm()">${ic.chat} Заявка</a>
    <a class="btn btn-o" href="${M.phoneHref}">${ic.phone} Звонок</a>
  </div>
</header>

<div class="strip"><div class="run"><span>${marquee}</span><span>${marquee}</span></div></div>

<div class="stats">
  ${M.stats.map(s=>`<div class="c"><div class="v">${s.v}</div><div class="l">${s.l}</div></div>`).join('')}
</div>

<section>
  <div class="sec-head"><span class="tag line">Чек-лист</span><h2>Что я <span class="yel">проверяю</span></h2>
  <p class="lead">Полная разборка по фактам — мотор, кузов, бумаги. Прячут косяки — найду.</p></div>
  <div class="checks">
    ${M.checks.map((c,i)=>`<div class="check"><div class="no">${String(i+1).padStart(2,'0')}</div><div><h3>${c.t}</h3><p>${c.d}</p></div></div>`).join('')}
  </div>
</section>

<div class="hazard"></div>

<section>
  <div class="sec-head"><span class="tag line">Процесс</span><h2>Как идёт <span class="yel">дело</span></h2></div>
  <div class="steps">
    ${M.steps.map(s=>`<div class="pstep"><div class="n">${s.n}</div><h3>${s.t}</h3><p>${s.d}</p></div>`).join('')}
  </div>
  <div class="spectags">${M.specs.map(s=>`<span>${s}</span>`).join('')}</div>
</section>

<section style="padding-top:0">
  <div class="sec-head"><span class="tag line">Цена</span><h2>Сколько <span class="yel">стоит</span></h2>
  <p class="lead">От 1 500 ₽ за разовый осмотр. Зависит от модели и локации. Консультация — даром.</p></div>
  ${M.pricing.map(p=>`<div class="pcard ${p.note?'hit':''}">${p.note?`<span class="badge">${p.note}</span>`:''}<h3>${p.t}</h3><div class="p">${p.p}</div><p class="d">${p.d}</p></div>`).join('')}
</section>

<section style="padding:30px 18px 18px">
  <div class="sec-head"><span class="tag line">Портфолио</span><h2>Со <span class="yel">смотров</span></h2></div>
</section>
<div class="gal">
  ${M.gallery.map((g,i)=>`<div class="gcard"><img src="${g.src}" loading="lazy" alt="${g.cap}"><div class="cap">№${String(i+1).padStart(3,'0')} · ${g.cap}</div></div>`).join('')}
</div>

<section id="reviews">
  <div class="sec-head"><span class="tag line">Отзывы</span><h2><span class="yel">5,0</span> на Авито</h2>
  <p class="lead">126 оценок, 125 из них — пятёрки. Скрины настоящие, листай.</p></div>
</section>
<div class="revscroll">
  ${M.reviewShots.map(s=>`<div class="revcard" onclick="openLB('${s}')"><img src="${s}" loading="lazy" alt="отзыв"></div>`).join('')}
</div>
<p class="hint">// тап — открыть скрин</p>

<section>
  <div class="sec-head"><span class="tag line">FAQ</span><h2>Вопрос — <span class="yel">ответ</span></h2></div>
  <div class="faq">
    ${M.faq.map(f=>`<details class="qa"><summary>${f.q}<span class="pm">+</span></summary><div class="a">${f.a}</div></details>`).join('')}
  </div>
</section>

<section style="padding-top:0">
  <div class="final">
    <h2>Кидай объяву —<br>разберёмся</h2>
    <p>Модель или ссылка на Авито. Скажу, стоит ли смотреть, и выеду на осмотр.</p>
    <div class="cta-row" style="padding:0">
      <a class="btn btn-y" href="javascript:openForm()">${ic.chat} Заявка</a>
      <a class="btn btn-o" href="${M.phoneHref}">${ic.phone} Звонок</a>
    </div>
  </div>
</section>

<footer>
  <b>${M.expert.toUpperCase()} · МОТОПОДБОР</b><br>
  Выездная диагностика · ${M.city} и +200 км<br>
  © ${new Date().getFullYear()} · реальные фото и отзывы клиентов
</footer>
`;

document.body.appendChild(el(`<div class="bottombar">
  <a class="btn btn-y" href="javascript:openForm()">${ic.chat} Написать</a>
  <a class="btn btn-o" href="${M.phoneHref}">${ic.phone} Позвонить</a>
</div>`));

function openLB(s){document.getElementById('lbimg').src=s;document.getElementById('lb').classList.add('on');}
function closeLB(){document.getElementById('lb').classList.remove('on');}
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLB();});
function formHTML(){return `
  <h3>Оставить заявку</h3>
  <p class="s">Отвечу за пару часов. Консультация бесплатно.</p>
  <div class="field"><label>Имя</label><input placeholder="Как обращаться"></div>
  <div class="field"><label>Телефон / мессенджер</label><input placeholder="+7 ___ ___-__-__"></div>
  <div class="field"><label>Мотоцикл или ссылка</label><textarea rows="2" placeholder="Напр.: Honda CBR600RR 2008, ссылка…"></textarea></div>
  <button class="btn btn-y" style="width:100%;margin-top:4px" onclick="submitForm(this)">Отправить</button>
  <button class="btn btn-o" style="width:100%;height:46px;margin-top:10px" onclick="closeForm()">Отмена</button>`;}
function openForm(){document.getElementById('sheet').innerHTML=formHTML();document.getElementById('modal').classList.add('on');}
function closeForm(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeForm();});
function submitForm(btn){
  if(btn){btn.disabled=true;btn.textContent='Отправляю…';}
  Promise.resolve(sendLead()).then(function(ok){
    const sheet=document.getElementById('sheet');
    if(ok){
      sheet.innerHTML=`<div class="thanks"><div class="ok">${ck}</div><h3 style="font-size:26px">Принято!</h3><p class="s" style="margin:10px 0 18px">Дмитрий свяжется с тобой в ближайшее время.</p><button class="btn btn-y" style="width:100%" onclick="closeForm()">Готово</button></div>`;
    }else{
      sheet.innerHTML=`<div class="thanks"><h3 style="font-size:24px">Не отправилось</h3><p class="s" style="margin:10px 0 18px">Что-то с интернетом. Напишите или позвоните напрямую — отвечу сразу.</p><a class="btn btn-y" style="width:100%;margin-bottom:10px" href="${M.phoneHref}">${ic.phone} Позвонить</a><button class="btn btn-o" style="width:100%" onclick="openForm()">Попробовать ещё раз</button></div>`;
    }
  });
}
Object.assign(window,{openLB,closeLB,openForm,closeForm,submitForm});
</script>
</body>
</html>
